project:
  title:        "Tiny Protocol Nexus"
  author:       "praneel"
  discord:      ""
  description:  "AXI4-Lite/APB4 protocol gateway, checker, trace buffer and fault injector"
  language:     "Verilog"
  clock_hz:     50000000

  # This is an intentionally area-conscious starting point. Run the TinyTapeout
  # flow before tapeout and adjust the tile count from actual synthesis results.
  tiles: "6x2"
  top_module:  "tt_um_protocol_nexus"

  source_files:
    - "project.v"

pinout:
  ui[0]: "HOST_DATA[0]"
  ui[1]: "HOST_DATA[1]"
  ui[2]: "HOST_DATA[2]"
  ui[3]: "HOST_DATA[3]"
  ui[4]: "HOST_DATA[4]"
  ui[5]: "HOST_DATA[5]"
  ui[6]: "HOST_DATA[6]"
  ui[7]: "HOST_DATA[7]"

  uo[0]: "RESPONSE[0]"
  uo[1]: "RESPONSE[1]"
  uo[2]: "RESPONSE[2]"
  uo[3]: "RESPONSE[3]"
  uo[4]: "RESPONSE[4]"
  uo[5]: "RESPONSE[5]"
  uo[6]: "RESPONSE[6]"
  uo[7]: "RESPONSE[7]"

  uio[0]: "RESP_VALID (output)"
  uio[1]: "BUSY (output)"
  uio[2]: "ERROR (output)"
  uio[3]: "TRACE_VALID (output)"
  uio[4]: "CMD_STB (input)"
  uio[5]: "RSP_READY (input)"
  uio[6]: "reserved"
  uio[7]: "reserved"

yaml_version: 6
